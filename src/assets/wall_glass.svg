<svg xmlns="http://www.w3.org/2000/svg" width="216" height="64" viewBox="0 0 216 64">
  <!-- 中のオフィス（暗い室内と照明） -->
  <rect width="216" height="64" fill="#0d1320" fill-opacity="0.8"/>
  <g fill="#ffe9b0" fill-opacity="0.9">
    <rect x="20" y="10" width="28" height="6"/>
    <rect x="70" y="26" width="28" height="6"/>
    <rect x="120" y="10" width="28" height="6"/>
    <rect x="170" y="40" width="28" height="6"/>
  </g>
  <!-- 透けたガラスの横線と縦線（薄く） -->
  <g stroke="#0f1520" stroke-width="2" stroke-opacity="0.7">
    <line x1="0" y1="16" x2="216" y2="16"/>
    <line x1="0" y1="32" x2="216" y2="32"/>
    <line x1="0" y1="48" x2="216" y2="48"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35">
    <line x1="54" y1="0" x2="54" y2="64"/>
    <line x1="126" y1="0" x2="126" y2="64"/>
    <line x1="198" y1="0" x2="198" y2="64"/>
  </g>
</svg>